<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
body { width:1080px; height:1080px; display:flex; flex-direction:column;
       justify-content:center; padding:0 82px; }
.halo { width:900px; height:900px; right:-300px; top:-240px; }
.etiqueta { font-size:18px; letter-spacing:.32em; margin-bottom:18px; }
.titular { font-size:56px; margin-bottom:12px; }
.fuente { font-family:'IBM Plex Mono',monospace; font-size:16px; letter-spacing:.1em;
          color:var(--tenue); margin-bottom:54px; }
/* Una sola serie: la identidad la llevan las etiquetas, no el color. Por eso
   no hay leyenda y todas las barras comparten tono. */
.fila { display:grid; grid-template-columns:288px 452px 74px; align-items:center;
        gap:20px; margin-bottom:22px; }
.etq { font-size:21px; color:rgba(245,230,196,.9); line-height:1.25; }
.pista { height:26px; display:flex; align-items:center; }
.barra { height:26px; border-radius:0 5px 5px 0; }
.val { font-family:'Jost',sans-serif; font-weight:500; font-size:36px; text-align:right; color:var(--crema); }
/* "Sin perfil" no es una profesión: se separa y se apaga para que no se lea
   como una categoría más de la lista. */
.aparte { margin-top:34px; padding-top:30px; border-top:1px solid rgba(245,230,196,.16); }
.aparte .etq, .aparte .val { color:var(--apagado); }
.pie { margin-top:46px; font-size:22px; line-height:1.45; color:rgba(245,230,196,.72); }
</style>
<svg class="panal" xmlns="http://www.w3.org/2000/svg"><defs>
<pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(1.6)">
<path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none" stroke="#E8A93A" stroke-width="1.3"/>
<path d="M28 64 L56 80 L56 112 L28 128 L0 112 L0 80 Z" fill="none" stroke="#E8A93A" stroke-width="1.3"/>
</pattern></defs><rect width="100%" height="100%" fill="url(#hex)"/></svg>

<div class="halo"></div>
<p class="etiqueta">Quién hay dentro</p>
<h1 class="titular">83 perfiles, mirados uno a uno.</h1>
<p class="fuente">18 de septiembre de 2026 · hoy somos 88</p>
<div class="fila ">
  <div class="etq">Logopedas y fonoaudiólogas</div>
  <div class="pista"><div class="barra" style="width:452px;background:var(--miel)"></div></div>
  <div class="val">36</div>
</div>
<div class="fila ">
  <div class="etq">Maestras y maestros de AL</div>
  <div class="pista"><div class="barra" style="width:188px;background:var(--miel)"></div></div>
  <div class="val">15</div>
</div>
<div class="fila ">
  <div class="etq">Psicología o pedagogía</div>
  <div class="pista"><div class="barra" style="width:38px;background:var(--miel)"></div></div>
  <div class="val">3</div>
</div>
<div class="fila ">
  <div class="etq">Estudiantes</div>
  <div class="pista"><div class="barra" style="width:25px;background:var(--miel)"></div></div>
  <div class="val">2</div>
</div>
<div class="fila ">
  <div class="etq">Familia (además sanitario)</div>
  <div class="pista"><div class="barra" style="width:13px;background:var(--miel)"></div></div>
  <div class="val">1</div>
</div>
<div class="fila aparte">
  <div class="etq">Sin perfil rellenado</div>
  <div class="pista"><div class="barra" style="width:326px;background:var(--apagado)"></div></div>
  <div class="val">26</div>
</div>
<p class="pie">España, Venezuela, Bolivia y Argentina.</p>
